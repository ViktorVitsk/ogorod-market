[tool.poetry]  # Добавьте эту секцию для конфигурации Poetry
packages = [{include = "app"}]

[tool.poetry.scripts]
migrate = "alembic.config:main"

[project]
name = "ogorod-market-api"
version = "0.1.0"
description = "Backend API for vegetable market"
authors = [
    {name = "Viktor Stoianov",email = "viktor.web.frontend@gmail.com"}
]

requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
httpx = "^0.28.1"



[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"